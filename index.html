<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop 4 - Page Layout</title>
    
    <style>
        body { font-family: sans-serif; margin: 20px; }

        header { border-bottom: 2px solid #ccc; padding-bottom: 10px; margin-bottom: 20px; }
        nav ul { list-style-type: none; padding: 0; display: flex; gap: 15px; }
        nav a { text-decoration: none; color: blue; }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 10px;
            margin-bottom: 30px;
        }
        .grid-item {
            background-color: lightgreen;
            padding: 20px;
            text-align: center;
        }

        .flex-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 30px;
        }
        .box {
            background-color: lightblue;
            padding: 20px;
            text-align: center;
            width: 100px; 
        }

        .responsive-box {
            padding: 20px;
            text-align: center;
            border: 1px solid #000;
        }

        @media (max-width: 600px) {
            .responsive-box {
                background-color: lightcoral;
            }
        }

        @media (min-width: 601px) {
            .responsive-box {
                background-color: lightseagreen;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>My Website</h1>
        <nav>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="about">
            <h2>About Me</h2>
            <p>This is a paragraph about me.</p>
        </section>

        <h2>Task 2: Grid Layout</h2>
        <div class="grid-container">
            <div class="grid-item">1</div>
            <div class="grid-item">2</div>
            <div class="grid-item">3</div>
            <div class="grid-item">4</div>
            <div class="grid-item">5</div>
            <div class="grid-item">6</div>
        </div>

        <h2>Task 3: Flexbox Layout</h2>
        <div class="flex-container">
            <div class="box">Box 1</div>
            <div class="box">Box 2</div>
            <div class="box">Box 3</div>
        </div>

        <h2>Task 4: Media Queries</h2>
        <div class="responsive-box">Resize the window to see the effect</div>

    </main>

    <footer>
        <p>Copyright 2025</p>
    </footer>

</body>
</html>
