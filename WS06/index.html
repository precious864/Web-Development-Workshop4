<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop 6 - Bootstrap</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Task 1: Responsive Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Brand</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        
        <!-- Task 2: Grid Layout -->
        <h2>Task 2: Grid Layout</h2>
        <div class="row mb-4">
            <div class="col-md-4 col-12 border p-3 bg-light">Column 1</div>
            <div class="col-md-4 col-12 border p-3 bg-light">Column 2</div>
            <div class="col-md-4 col-12 border p-3 bg-light">Column 3</div>
        </div>

        <!-- Task 3: Buttons -->
        <h2>Task 3: Buttons</h2>
        <div class="mb-4">
            <button class="btn btn-primary">Primary</button>
            <button class="btn btn-secondary">Secondary</button>
            <button class="btn btn-success">Success</button>
        </div>

        <!-- Task 4: Card -->
        <h2>Task 4: Card</h2>
        <div class="card mb-4" style="width: 18rem;">
            <img src="https://picsum.photos/300/200" class="card-img-top" alt="Card Image">
            <div class="card-body">
                <h5 class="card-title">Card Title</h5>
                <p class="card-text">This is a simple card example using Bootstrap.</p>
                <a href="#" class="btn btn-primary">Learn More</a>
            </div>
        </div>

        <!-- Task 5: Alert -->
        <h2>Task 5: Alert</h2>
        <div class="alert alert-warning" role="alert">
            This is a warning alert—check it out!
        </div>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
